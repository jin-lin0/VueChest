<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta
      name="description"
      content="VueChest - 一站式个人效率工具箱，包含待办事项、笔记、番茄钟、记账本、AI对话等实用工具"
    />
    <meta name="format-detection" content="telephone=no" />
    <!--
      Rajdhani：音游界面用的显示字体。
      选它而不是 Orbitron/Space Grotesk 之类：它的数字字形窄而挺，
      等宽数字（tabular-nums）在分数飞速滚动时不会晃，同时带一点科技感
      又不会像纯装饰字体那样牺牲可读性。仅音游模块使用，按需加载。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>VueChest - 应用中心</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
